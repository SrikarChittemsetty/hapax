name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mdt
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job runs.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HAPAX_TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=mdt"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Type-check
        run: mypy src/hapax

      - name: Run tests (incl. crash-recovery against Postgres)
        run: pytest -v

      - name: Benchmark (smoke)
        run: python bench/benchmark.py --conninfo "$HAPAX_TEST_DATABASE_URL" --iterations 200 --warmup 50

      # The Go load harness is a benchmark, not library code, but it issues the
      # same SQL as the Python store — so if a schema change breaks it, that is
      # worth finding here rather than the next time someone runs a comparison.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: bench/go/go.sum

      - name: Build and vet the Go harness
        working-directory: bench/go
        run: |
          go vet ./...
          go build ./...

      - name: Go harness smoke run
        working-directory: bench/go
        run: |
          go run . --conninfo "postgres://postgres:postgres@127.0.0.1:5432/mdt" \
            --tasks 500 --workers 1,4
