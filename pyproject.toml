[project]
name = "hapax"
version = "0.1.0"
description = "A crash-durable, spec-conformant task store for the MCP Tasks extension (SEP-2663) — the persistent store the reference SDKs leave to implementers."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Metrics and traces. Kept optional so the core install stays dependency-free —
# src/hapax/telemetry.py degrades every call to a no-op when these are absent.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-prometheus>=0.48b0",
  "prometheus-client>=0.21",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "testcontainers[postgres]>=4.0", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hapax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
packages = ["hapax"]
warn_unused_ignores = true
warn_redundant_casts = true
